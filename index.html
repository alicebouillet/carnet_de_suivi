          ["Courses", shoppingCount, C.courses],
          ["Mesures", bodyCount, C.corps],
          ["Séances", workoutCount, C.muscu],
        ].map(([label, value, color]) => (
          <Card key={label} style={{ padding: 16, borderTop: `3px solid ${color}` }}>
            <div className="font-mono text-xs uppercase tracking-widest" style={{ color: C.inkFaint }}>{label}</div>
            <div className="font-display text-2xl mt-2" style={{ color }}>{value}</div>
          </Card>
        ))}
      </div>
      <div className="font-mono text-xs uppercase tracking-widest mb-3" style={{ color: C.inkFaint }}>Accès rapide</div>
      <div className="grid grid-cols-3 home-shortcuts gap-3">
        {shortcuts.map((shortcut) => {
          const ShortcutIcon = shortcut.icon;
          return (
            <button key={shortcut.id} onClick={() => setTab(shortcut.id)} className="font-body text-left rounded-lg p-4"
              style={{ background: C.paper, border: `1px solid ${C.line}`, color: C.ink, cursor: "pointer", boxShadow: "0 6px 18px rgba(66,54,40,0.05)" }}>
              <div className="flex items-center gap-3">
                <span className="flex items-center justify-center rounded-full" style={{ width: 34, height: 34, color: shortcut.color, background: `${shortcut.color}18` }}><ShortcutIcon size={17} /></span>
                <span className="min-w-0"><strong className="font-body text-sm block">{shortcut.label}</strong><span className="font-mono text-xs" style={{ color: C.inkFaint }}>{shortcut.description}</span></span>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const TABS = [
  { id: "accueil", label: "Accueil", icon: Home, color: C.ink },
  { id: "recettes", label: "Recettes", icon: BookOpen, color: C.nutrition },
  { id: "courses", label: "Courses", icon: ShoppingCart, color: C.courses },
  { id: "quantites", label: "Quantités", icon: Scale, color: C.courses },
  { id: "corps", label: "Corps", icon: Scale, color: C.corps },
  { id: "muscu", label: "Muscu", icon: Dumbbell, color: C.muscu },
  { id: "machines", label: "Répertoire machines", icon: Dumbbell, color: C.muscu },
  { id: "planning", label: "Planning", icon: CalendarDays, color: C.planning },
];

function App() {
  const [tab, setTab] = useState("accueil");
  const [profileId, setProfileId] = useState("p1");
  const [editingProfile, setEditingProfile] = useState(null);
  const { data, update, ready, synced } = useSyncedStore();

  const addToGrocery = (ingredients) => {
    const next = [...data.grocery];
    ingredients.forEach((ing) => {
      const existing = next.find((x) => x.nom.toLowerCase() === ing.nom.toLowerCase() && !x.checked);
      if (existing) existing.qte = existing.qte && ing.qte ? `${existing.qte} + ${ing.qte}` : (existing.qte || ing.qte);
      else next.push({ id: uid(), nom: ing.nom, qte: ing.qte, unite: ing.unite, checked: false });
    });
    update({ grocery: next });
    setTab("courses");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `carnet-export-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (!ready) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg }}><span className="font-mono text-sm" style={{ color: C.inkFaint }}>chargement du carnet…</span></div>;
  }

  const TabComponent = {
    accueil: <AccueilTab data={data} profiles={data.profiles} profileId={profileId} setProfileId={setProfileId} setTab={setTab} />,
    recettes: <RecettesTab recipes={data.recipes} setRecipes={(v) => update({ recipes: v })} addToGrocery={addToGrocery} />,
    courses: <CoursesTab grocery={data.grocery} setGrocery={(v) => update({ grocery: v })} />,
    quantites: <QuantitesTab quantities={data.quantities} setQuantities={(v) => update({ quantities: v })} quantityMeta={data.quantityMeta} setQuantityMeta={(v) => update({ quantityMeta: v })} customCategories={data.customQuantityCategories} setCustomCategories={(v) => update({ customQuantityCategories: v })} customProducts={data.customQuantityProducts} setCustomProducts={(v) => update({ customQuantityProducts: v })} hiddenProducts={data.hiddenQuantityProducts} setHiddenProducts={(v) => update({ hiddenQuantityProducts: v })} profiles={data.profiles} />,
    machines: <RepertoireMachinesTab machinesByProfile={data.machines} setMachinesByProfile={(v) => update({ machines: v })} customCategories={data.customMachineCategories} setCustomCategories={(v) => update({ customMachineCategories: v })} profiles={data.profiles} />,
    corps: <CorpsTab entries={data.body[profileId]} setEntries={(v) => update({ body: { ...data.body, [profileId]: v } })} />,
    muscu: <MuscuTab sessions={data.workouts[profileId]} setSessions={(v) => update({ workouts: { ...data.workouts, [profileId]: v } })}
      machines={data.machines[profileId]} setMachines={(v) => update({ machines: { ...data.machines, [profileId]: v } })}
      planningItems={data.planning[profileId]} setPlanningItems={(v) => update({ planning: { ...data.planning, [profileId]: v } })} />,
    planning: <PlanningTab items={data.planning[profileId]} setItems={(v) => update({ planning: { ...data.planning, [profileId]: v } })} recipes={data.recipes} />,
  }[tab];

  const needsProfile = ["corps", "muscu", "planning", "quantites", "machines"].includes(tab);

  return (
    <div className="font-body" style={{ minHeight: "100vh", background: `radial-gradient(circle at 8% 0%, rgba(255,253,248,0.95) 0, rgba(255,253,248,0) 30%), linear-gradient(135deg, ${C.bg} 0%, #DFECE5 100%)` }}>
      <div className="app-shell">
        <aside className="sidebar">
          <div className="sidebar-brand mb-6">
            <div className="font-display text-2xl font-bold" style={{ color: C.ink }}>Carnet</div>
            <div className="font-mono text-xs mt-1" style={{ color: C.inkFaint }}>prendre soin de soi</div>
          </div>
          <nav className="sidebar-nav" aria-label="Navigation principale">
            {TABS.map((t) => {
              const Icon2 = t.icon; const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className="font-body text-sm px-4 py-3 inline-flex items-center gap-1.5 rounded-full transition-all"
                  style={{ color: active ? "#fff" : C.inkSoft, background: active ? t.color : "transparent", border: "none", cursor: "pointer", boxShadow: active ? "0 4px 12px rgba(45,62,95,0.15)" : "none" }}>
                  <Icon2 size={16} />{t.label}
                </button>
              );
            })}
          </nav>
        </aside>
        <main className="content-area">
      <div className="max-w-4xl mx-auto px-5 pt-8 pb-24">
        <header className="flex items-end justify-between mb-8 flex-wrap gap-4">
          <div>
            <div className="flex items-center gap-3">
              <h1 className="font-display text-3xl font-bold" style={{ color: C.ink }}>Carnet</h1>
              <span title={synced ? "synchronisé" : "synchronisation…"} style={{ width: 9, height: 9, borderRadius: 999, background: synced ? C.nutrition : "#FFB381", display: "inline-block", boxShadow: synced ? "0 0 0 3px rgba(93,186,165,0.2)" : "0 0 0 3px rgba(255,179,129,0.2)" }} />
              <IconBtn onClick={exportData} title="Exporter toutes les données (JSON)"><Download size={16} /></IconBtn>
            </div>
            <p className="font-mono text-xs mt-2" style={{ color: C.inkFaint, letterSpacing: "0.08em" }}>TON espace pour prendre soin de toi</p>
          </div>
          {needsProfile && (
            <div className="flex rounded-full p-1.5" style={{ background: C.paper, border: `1px solid ${C.line}`, boxShadow: "0 5px 14px rgba(66,54,40,0.08)" }}>
              {["p1", "p2"].map((pid) => (
                <button key={pid} onClick={() => setProfileId(pid)} className="font-body text-sm px-4 py-2 rounded-full transition-all"
                  style={{ background: profileId === pid ? C.corps : "transparent", color: profileId === pid ? "#fff" : C.inkSoft, boxShadow: profileId === pid ? "0 2px 8px rgba(74,111,165,0.3)" : "none", border: "none", cursor: "pointer" }}>
                  <input value={data.profiles[pid].name} readOnly={editingProfile !== pid} title="Double-cliquez pour renommer" onDoubleClick={(e) => { e.stopPropagation(); setEditingProfile(pid); }} onBlur={() => setEditingProfile(null)} onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }} onChange={(e) => update({ profiles: { ...data.profiles, [pid]: { name: e.target.value } } })} onClick={(e) => e.stopPropagation()}
                    className="bg-transparent outline-none text-center" style={{ color: "inherit", font: "inherit", border: "none", width: 96 }} />
                </button>
              ))}
            </div>
          )}
        </header>

        {TabComponent}
      </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
