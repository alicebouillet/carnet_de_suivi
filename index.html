<script>
  // Filet de sécurité : si quelque chose casse, on l'affiche à l'écran
  // au lieu de laisser une page blanche silencieuse.
  function showDiag(msg) {
    var el = document.getElementById("diag");
    if (!el) {
      el = document.createElement("div");
      el.id = "diag";
      el.style.cssText = "font-family:monospace;font-size:13px;padding:20px;color:#A94B3D;background:#FBEEE2;white-space:pre-wrap;line-height:1.5;";
      document.body.appendChild(el);
    }
    el.textContent += (el.textContent ? "\n\n" : "") + msg;
  }
  window.addEventListener("error", function (e) {
    showDiag("Erreur : " + e.message + (e.filename ? "\n(" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showDiag("Erreur (promesse) : " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.children.length === 0 && !document.getElementById("diag")) {
        showDiag("La page ne s'est pas chargée (l'appli ne s'est pas lancée) et aucune erreur n'a été capturée. Vérifie ta connexion internet, ou que SUPABASE_URL / SUPABASE_ANON_KEY sont bien remplis dans index.html.");
      }
    }, 4000);
  });
  // Enregistrement du service worker pour le mode offline (PWA)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (registration) {
        console.log("Service Worker enregistré avec succès:", registration.scope);
      }).catch(function (error) {
        console.log("Échec de l'enregistrement du Service Worker:", error);
      });
    });
  }
</script>

/* Store Supabase : une seule ligne contient tout, synchronisée en temps réel. */
function useSyncedStore() {
  const [data, setData] = useState(emptyStore);
  const [ready, setReady] = useState(false);
  const [synced, setSynced] = useState(false);
  const skip = useRef(true);
  const sb = useRef(null);
  const timer = useRef(null);

  useEffect(() => {
    let channel;
    const init = async () => {
      sb.current = window.__supabase;

      const { data: row, error } = await sb.current.from("carnet").select("data").eq("id", "data").single();
      if (row && row.data) {
        setData((prev) => ({ ...emptyStore, ...prev, ...row.data }));
      } else {
        // aucune ligne encore : on l'initialise
        await sb.current.from("carnet").insert({ id: "data", data: emptyStore });
      }
      setReady(true); setSynced(true);
      setTimeout(() => { skip.current = false; }, 0);

      channel = sb.current
        .channel("carnet-sync")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "carnet", filter: "id=eq.data" }, (payload) => {
          if (payload.new && payload.new.data) setData((prev) => ({ ...emptyStore, ...prev, ...payload.new.data }));
        })
        .subscribe();
    };
    if (window.__supabase) init();
    else window.addEventListener("supabase-ready", init, { once: true });
    return () => { if (channel && sb.current) sb.current.removeChannel(channel); };
  }, []);

  const update = (patch) => {
    setData((prev) => {
      const next = { ...prev, ...patch };
      if (!skip.current && sb.current) {
        setSynced(false);
        clearTimeout(timer.current);
        timer.current = setTimeout(async () => {
          const { error } = await sb.current.from("carnet").update({ data: next, updated_at: new Date().toISOString() }).eq("id", "data");
          setSynced(!error);
          if (error) console.error("Erreur sync", error);
        }, 350);
      }
      return next;
    });
  };

  return { data, update, ready, synced };
}

function MiniLineChart({ data, color, height = 170 }) {
  const w = 600;
  const points = useMemo(() => {
    const vals = data.map((d) => d.value).filter((v) => v != null && !isNaN(v));
    if (vals.length === 0) return [];
    const min = Math.min(...vals), max = Math.max(...vals);
    const pad = (max - min) * 0.15 || 1;
    const yMin = min - pad, yMax = max + pad;
    const stepX = data.length > 1 ? w / (data.length - 1) : 0;
    return data.map((d, i) => ({
      x: i * stepX,
      y: d.value == null ? null : height - ((d.value - yMin) / (yMax - yMin)) * height,
      label: d.label,
    }));
  }, [data, height]);

  if (points.length === 0) return null;
  const path = points.filter((p) => p.y != null).map((p, i) => (i === 0 ? "M" : "L") + p.x + "," + p.y).join(" ");

  return (
    <svg viewBox={`0 0 ${w} ${height + 22}`} width="100%" height={height + 22} preserveAspectRatio="none">
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" />
      {points.map((p, i) => p.y != null && <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={color} />)}
      {points.map((p, i) => (
        <text key={i} x={p.x} y={height + 16} fontSize="10" fontFamily="IBM Plex Mono" fill={C.inkFaint} textAnchor="middle">{p.label}</text>
      ))}
    </svg>
  );
}

function RingProgress({ value, target, color, label, unit, size = 88 }) {
  const pct = target > 0 ? Math.min(100, (value / target) * 100) : 0;
  const r = (size - 12) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <div className="flex flex-col items-center" style={{ gap: 6 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.lineSoft} strokeWidth="9" />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="9"
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset .4s" }} />
      </svg>
      <div style={{ marginTop: -size + 4, height: size - 4, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column" }}>

    setEditing(null);
  };
  const remove = (id) => setRecipes(recipes.filter((r) => r.id !== id));

  const parseImport = () => {
    setImportError("");
    const lines = importText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) return;
    const parsed = [];
    for (const line of lines) {
      const [main, ingPart] = line.split("|");
      const parts = main.split(";").map((p) => p.trim());
      if (parts.length < 6 || !parts[0]) { setImportError(`Ligne ignorée: "${line.slice(0, 40)}..."`); continue; }
      const [nom, portions, kcal, glucides, lipides, proteines] = parts;
      const ingredients = ingPart
        ? ingPart.split(",").map((seg) => {
            const [inom, iqte, iunite] = seg.split(":").map((s) => (s || "").trim());
            return { id: uid(), nom: inom || "", qte: iqte || "", unite: iunite || "" };
          }).filter((i) => i.nom)
        : [];
      parsed.push({ id: uid(), nom, portions: portions || 1, kcal: kcal || 0, glucides: glucides || 0, lipides: lipides || 0, proteines: proteines || 0,
        ingredients: ingredients.length ? ingredients : [{ id: uid(), nom: "", qte: "", unite: "" }], etapes: "" });
    }
    if (parsed.length > 0) { setRecipes([...recipes, ...parsed]); setImportText(""); setShowImport(false); }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div><Eyebrow color={C.nutrition}>Recettes</Eyebrow><h2 className="font-display text-2xl" style={{ color: C.ink }}>Le carnet de recettes</h2></div>
        <div className="flex gap-2">
          <PrimaryBtn color={C.inkFaint} onClick={() => { setShowImport(!showImport); setEditing(null); }}>Importer</PrimaryBtn>
          <PrimaryBtn color={C.nutrition} onClick={() => { setEditing(blank()); setShowImport(false); }}><Plus size={16} /> Nouvelle recette</PrimaryBtn>
        </div>
      </div>

      {showImport && (
        <Card style={{ padding: 20, marginBottom: 20 }}>
          <div className="font-mono text-xs uppercase tracking-widest mb-2" style={{ color: C.inkFaint }}>Importer plusieurs recettes</div>
          <p className="font-body text-xs mb-3" style={{ color: C.inkFaint }}>
            Une recette par ligne : <span className="font-mono">Nom;Portions;Kcal;Glucides;Lipides;Protéines</span><br />
            Ingrédients optionnels après <span className="font-mono">|</span> : <span className="font-mono">riz:150:g,poivron:2:pièce</span>
          </p>
          <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={6}
            className="font-mono text-xs w-full px-2.5 py-2 rounded-md outline-none mb-2"
            style={{ border: `1px solid ${C.line}`, background: "#FCFCFA" }}
            placeholder={"Poulet au riz;4;450;40;10;38;poulet:600:g,riz:300:g\nSalade de pois chiches;2;380;35;14;18"} />
          {importError && <p className="font-body text-xs mb-2" style={{ color: "#A94B3D" }}>{importError}</p>}
          <div className="flex gap-2">
            <PrimaryBtn color={C.nutrition} onClick={parseImport}><Check size={14} /> Importer</PrimaryBtn>
            <PrimaryBtn color={C.inkFaint} onClick={() => { setShowImport(false); setImportText(""); setImportError(""); }}><X size={14} /> Annuler</PrimaryBtn>
          </div>
        </Card>
      )}

      {editing && (
        <Card style={{ padding: 20, marginBottom: 20 }}>
          <div className="grid grid-cols-2 gap-3 mb-3">
            <TextInput value={editing.nom} onChange={(v) => setEditing({ ...editing, nom: v })} placeholder="Nom de la recette" />
            <TextInput type="number" value={editing.portions} onChange={(v) => setEditing({ ...editing, portions: v })} placeholder="Portions" />
          </div>
          <div className="grid grid-cols-4 gap-3 mb-4">
            {[["kcal", "Calories / portion"], ["glucides", "Glucides (g)"], ["lipides", "Lipides (g)"], ["proteines", "Protéines (g)"]].map(([k, l]) => (
              <div key={k}><label className="font-mono text-xs" style={{ color: C.inkFaint }}>{l}</label><TextInput type="number" value={editing[k]} onChange={(v) => setEditing({ ...editing, [k]: v })} /></div>
            ))}
          </div>
          <div className="font-mono text-xs uppercase tracking-widest mb-2" style={{ color: C.inkFaint }}>Ingrédients</div>
          {editing.ingredients.map((ing, i) => (
            <div key={ing.id} className="grid gap-2 mb-2" style={{ gridTemplateColumns: "1fr 90px 90px 32px" }}>
              <TextInput value={ing.nom} onChange={(v) => { const arr = [...editing.ingredients]; arr[i] = { ...ing, nom: v }; setEditing({ ...editing, ingredients: arr }); }} placeholder="Ingrédient" />
              <TextInput value={ing.qte} onChange={(v) => { const arr = [...editing.ingredients]; arr[i] = { ...ing, qte: v }; setEditing({ ...editing, ingredients: arr }); }} placeholder="Qté" />
              <TextInput value={ing.unite} onChange={(v) => { const arr = [...editing.ingredients]; arr[i] = { ...ing, unite: v }; setEditing({ ...editing, ingredients: arr }); }} placeholder="Unité" />
              <IconBtn danger onClick={() => setEditing({ ...editing, ingredients: editing.ingredients.filter((x) => x.id !== ing.id) })}><Trash2 size={15} /></IconBtn>
            </div>
          ))}
          <button onClick={() => setEditing({ ...editing, ingredients: [...editing.ingredients, { id: uid(), nom: "", qte: "", unite: "" }] })}
            className="font-body text-xs mb-4" style={{ color: C.nutrition, background: "none", border: "none", cursor: "pointer" }}>+ ajouter un ingrédient</button>
          <label className="font-mono text-xs uppercase tracking-widest mb-2 block" style={{ color: C.inkFaint }}>Préparation</label>
          <textarea value={editing.etapes} onChange={(e) => setEditing({ ...editing, etapes: e.target.value })} rows={3}
            className="font-body text-sm w-full px-2.5 py-2 rounded-md outline-none mb-4" style={{ border: `1px solid ${C.line}`, background: "#FCFCFA" }} placeholder="Étapes de préparation..." />
          <div className="flex gap-2">
            <PrimaryBtn color={C.nutrition} onClick={save}><Check size={15} /> Enregistrer</PrimaryBtn>
            <PrimaryBtn color={C.inkFaint} onClick={() => setEditing(null)}><X size={15} /> Annuler</PrimaryBtn>
          </div>
        </Card>
      )}

      {recipes.length === 0 && !editing && <EmptyState icon={<BookOpen size={28} />} color={C.nutrition} text="Aucune recette pour l'instant. Ajoutez-en une ou importez-en plusieurs." />}

      <div className="grid grid-cols-2 gap-3">
        {recipes.map((r) => (
          <Card key={r.id} style={{ padding: 16 }}>
            <div className="flex justify-between items-start">
              <div className="cursor-pointer" onClick={() => setExpanded(expanded === r.id ? null : r.id)}>
                <div className="font-display text-lg" style={{ color: C.ink }}>{r.nom}</div>
                <div className="font-mono text-xs mt-1" style={{ color: C.inkFaint }}>{r.portions} portions</div>
              </div>
              <div className="flex gap-1">
                <IconBtn onClick={() => setEditing(r)} title="Modifier"><span className="font-mono text-xs px-1">éd.</span></IconBtn>
                <IconBtn danger onClick={() => remove(r.id)} title="Supprimer"><Trash2 size={15} /></IconBtn>
              </div>
            </div>
            <div className="flex gap-3 mt-3 flex-wrap">
              <span className="font-mono text-xs px-2 py-1 rounded" style={{ background: C.nutritionSoft, color: C.nutrition }}>{r.kcal} kcal</span>
              <span className="font-mono text-xs px-2 py-1 rounded" style={{ background: C.lineSoft, color: C.inkSoft }}>G {r.glucides}g</span>
              <span className="font-mono text-xs px-2 py-1 rounded" style={{ background: C.lineSoft, color: C.inkSoft }}>L {r.lipides}g</span>
              <span className="font-mono text-xs px-2 py-1 rounded" style={{ background: C.lineSoft, color: C.inkSoft }}>P {r.proteines}g</span>
            </div>
            {expanded === r.id && (
              <div className="mt-3" style={{ paddingTop: 12, borderTop: `1px solid ${C.lineSoft}` }}>
                <ul className="font-body text-sm mb-2" style={{ color: C.inkSoft, paddingLeft: 0, listStyle: "none" }}>
                  {r.ingredients.filter((i) => i.nom).map((i) => <li key={i.id}>• {i.nom} {i.qte} {i.unite}</li>)}
                </ul>
                {r.etapes && <p className="font-body text-sm whitespace-pre-wrap" style={{ color: C.inkSoft }}>{r.etapes}</p>}
              </div>
            )}
            <button onClick={() => addToGrocery(r.ingredients.filter((i) => i.nom))} className="font-body text-xs mt-3 inline-flex items-center gap-1"
              style={{ color: C.courses, background: "none", border: "none", cursor: "pointer" }}><ShoppingCart size={13} /> ajouter à la liste de courses</button>
          </Card>
        ))}
      </div>
    </div>
  );
}

function CoursesTab({ grocery, setGrocery }) {
  const [nom, setNom] = useState(""); const [qte, setQte] = useState(""); const [unite, setUnite] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");

  const add = () => { if (!nom.trim()) return; setGrocery([...grocery, { id: uid(), nom, qte, unite, checked: false }]); setNom(""); setQte(""); setUnite(""); };
  const toggle = (id) => setGrocery(grocery.map((g) => (g.id === id ? { ...g, checked: !g.checked } : g)));
  const remove = (id) => setGrocery(grocery.filter((g) => g.id !== id));
  const clearChecked = () => setGrocery(grocery.filter((g) => !g.checked));

  const parseImport = () => {
    const lines = importText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) return;
    const items = lines.map((line) => {
      const [n, q, u] = line.split(";").map((s) => (s || "").trim());
      return { id: uid(), nom: n, qte: q || "", unite: u || "", checked: false };
    }).filter((i) => i.nom);
    if (items.length > 0) { setGrocery([...grocery, ...items]); setImportText(""); setShowImport(false); }
  };

  const unchecked = grocery.filter((g) => !g.checked);
  const checked = grocery.filter((g) => g.checked);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div><Eyebrow color={C.courses}>Courses</Eyebrow><h2 className="font-display text-2xl" style={{ color: C.ink }}>Liste partagée</h2></div>
        <PrimaryBtn color={C.inkFaint} onClick={() => setShowImport(!showImport)}>Importer une liste</PrimaryBtn>
      </div>

      {showImport && (
        <Card style={{ padding: 16, marginBottom: 16 }}>
          <p className="font-body text-xs mb-2" style={{ color: C.inkFaint }}>
            Un article par ligne. Formats acceptés : <span className="font-mono">Pommes</span> ou <span className="font-mono">Pommes;6;pièces</span>
          </p>
          <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={5}
            className="font-mono text-xs w-full px-2.5 py-2 rounded-md outline-none mb-2"
            style={{ border: `1px solid ${C.line}`, background: "#FCFCFA" }}
            placeholder={"Pommes;6;pièces\nRiz;1;kg\nLait"} />
          <div className="flex gap-2">
            <PrimaryBtn color={C.courses} onClick={parseImport}><Check size={14} /> Importer</PrimaryBtn>
            <PrimaryBtn color={C.inkFaint} onClick={() => { setShowImport(false); setImportText(""); }}><X size={14} /> Annuler</PrimaryBtn>
          </div>
        </Card>
      )}

      <Card style={{ padding: 14, marginBottom: 16 }}>
        <div className="grid gap-2" style={{ gridTemplateColumns: "1fr 90px 90px auto" }}>
          <TextInput value={nom} onChange={setNom} placeholder="Article" />
          <TextInput value={qte} onChange={setQte} placeholder="Qté" />
          <TextInput value={unite} onChange={setUnite} placeholder="Unité" />
          <PrimaryBtn color={C.courses} onClick={add}><Plus size={15} /></PrimaryBtn>
        </div>
      </Card>

      {grocery.length === 0 && <EmptyState icon={<ShoppingCart size={28} />} color={C.courses} text="Liste vide. Ajoutez un article, importez-en plusieurs, ou générez-la depuis une recette." />}

      {unchecked.length > 0 && (
        <Card style={{ marginBottom: 12 }}>
          {unchecked.map((g, idx) => (
            <div key={g.id} className="flex items-center gap-3 px-4 py-2.5" style={{ borderTop: idx > 0 ? `1px solid ${C.lineSoft}` : "none" }}>
              <button onClick={() => toggle(g.id)} className="w-4 h-4 rounded-sm flex-shrink-0" style={{ border: `1.5px solid ${C.courses}`, background: "none", cursor: "pointer" }} />
              <span className="font-body text-sm flex-1" style={{ color: C.ink }}>{g.nom}</span>
              <span className="font-mono text-xs" style={{ color: C.inkFaint }}>{g.qte} {g.unite}</span>
              <IconBtn danger onClick={() => remove(g.id)}><Trash2 size={14} /></IconBtn>
            </div>
          ))}
        </Card>
      )}

      {checked.length > 0 && (
        <div>
          <div className="flex justify-between items-center mb-2">
            <span className="font-mono text-xs uppercase tracking-widest" style={{ color: C.inkFaint }}>Dans le chariot</span>
            <button onClick={clearChecked} className="font-body text-xs" style={{ color: C.inkFaint, background: "none", border: "none", cursor: "pointer" }}>vider</button>
          </div>
          <Card>
            {checked.map((g, idx) => (
              <div key={g.id} className="flex items-center gap-3 px-4 py-2.5" style={{ borderTop: idx > 0 ? `1px solid ${C.lineSoft}` : "none", opacity: 0.5 }}>
                <button onClick={() => toggle(g.id)} className="w-4 h-4 rounded-sm flex items-center justify-center flex-shrink-0" style={{ background: C.courses, border: "none", cursor: "pointer" }}><Check size={11} color="#fff" /></button>
                <span className="font-body text-sm flex-1 line-through" style={{ color: C.inkFaint }}>{g.nom}</span>
                <span className="font-mono text-xs" style={{ color: C.inkFaint }}>{g.qte} {g.unite}</span>
                <IconBtn danger onClick={() => remove(g.id)}><Trash2 size={14} /></IconBtn>
              </div>
            ))}
          </Card>
        </div>
      )}
    </div>
  );
}

function RepasTab({ recipes, meals, setMeals, targets, setTargets }) {
  const [date, setDate] = useState(todayISO());
  const [showTargets, setShowTargets] = useState(false);
  const [form, setForm] = useState(null);

  const dayMeals = meals.filter((m) => m.date === date);
  const totals = dayMeals.reduce((acc, m) => ({
    kcal: acc.kcal + Number(m.kcal || 0), glucides: acc.glucides + Number(m.glucides || 0),
    lipides: acc.lipides + Number(m.lipides || 0), proteines: acc.proteines + Number(m.proteines || 0),
  }), { kcal: 0, glucides: 0, lipides: 0, proteines: 0 });

  const openForm = (repas) => setForm({ repas, mode: "manuel", recipeId: "", nom: "", kcal: "", glucides: "", lipides: "", proteines: "" });
  const pickRecipe = (recipeId) => {
    const r = recipes.find((x) => x.id === recipeId);
    if (!r) return setForm({ ...form, mode: "recette", recipeId: "" });
    setForm({ ...form, mode: "recette", recipeId, nom: r.nom, kcal: r.kcal, glucides: r.glucides, lipides: r.lipides, proteines: r.proteines });
  };
  const addMeal = () => {
    if (!form.nom.trim()) return;
    setMeals([...meals, { id: uid(), date, repas: form.repas, nom: form.nom, kcal: form.kcal, glucides: form.glucides, lipides: form.lipides, proteines: form.proteines }]);
    setForm(null);
  };
  const removeMeal = (id) => setMeals(meals.filter((m) => m.id !== id));

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div><Eyebrow color={C.nutrition}>Repas</Eyebrow><h2 className="font-display text-2xl" style={{ color: C.ink }}>Apports du jour</h2></div>
        <div className="flex items-center gap-2">
          <IconBtn onClick={() => setDate(addDays(date, -1))}><ChevronLeft size={16} /></IconBtn>
          <span className="font-mono text-sm capitalize" style={{ color: C.ink, minWidth: 130, textAlign: "center" }}>{fmtDateLong(date)}</span>
          <IconBtn onClick={() => setDate(addDays(date, 1))}><ChevronRight size={16} /></IconBtn>
        </div>
      </div>

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <div className="flex justify-between items-center mb-3">
          <span className="font-mono text-xs uppercase tracking-widest" style={{ color: C.inkFaint }}>Objectifs journaliers</span>
          <button onClick={() => setShowTargets(!showTargets)} className="font-body text-xs" style={{ color: C.nutrition, background: "none", border: "none", cursor: "pointer" }}>{showTargets ? "fermer" : "modifier"}</button>
        </div>
        {showTargets && (
          <div className="grid grid-cols-4 gap-3 mb-3">
            {[["kcal", "Calories"], ["glucides", "Glucides (g)"], ["lipides", "Lipides (g)"], ["proteines", "Protéines (g)"]].map(([k, l]) => (
              <div key={k}><label className="font-mono text-xs" style={{ color: C.inkFaint }}>{l}</label><TextInput type="number" value={targets[k]} onChange={(v) => setTargets({ ...targets, [k]: v })} /></div>
            ))}
          </div>
        )}
        <div className="flex justify-between" style={{ flexWrap: "wrap", gap: 12 }}>
          <RingProgress label="Calories" value={totals.kcal} target={targets.kcal} color={C.nutrition} unit="cal" />
          <RingProgress label="Glucides" value={totals.glucides} target={targets.glucides} color={C.corps} unit="g" />
          <RingProgress label="Lipides" value={totals.lipides} target={targets.lipides} color={C.courses} unit="g" />
          <RingProgress label="Protéines" value={totals.proteines} target={targets.proteines} color={C.planning} unit="g" />
        </div>
      </Card>

      {REPAS_TYPES.map((repas) => {
        const items = dayMeals.filter((m) => m.repas === repas);
        return (
          <div key={repas} className="mb-4">
            <div className="flex justify-between items-center mb-2">
              <span className="font-display text-base" style={{ color: C.ink }}>{repas}</span>
              <button onClick={() => openForm(repas)} className="font-body text-xs inline-flex items-center gap-1" style={{ color: C.nutrition, background: "none", border: "none", cursor: "pointer" }}><Plus size={13} /> ajouter</button>
            </div>
            {form && form.repas === repas && (
              <Card style={{ padding: 14, marginBottom: 8 }}>
                <div className="flex gap-2 mb-3">
                  <button onClick={() => setForm({ ...form, mode: "manuel" })} className="font-body text-xs px-2.5 py-1 rounded-full" style={{ background: form.mode === "manuel" ? C.nutrition : C.lineSoft, color: form.mode === "manuel" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Manuel</button>
                  <button onClick={() => setForm({ ...form, mode: "recette" })} className="font-body text-xs px-2.5 py-1 rounded-full" style={{ background: form.mode === "recette" ? C.nutrition : C.lineSoft, color: form.mode === "recette" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Depuis une recette</button>
                </div>
                {form.mode === "recette" ? (
                  <select value={form.recipeId} onChange={(e) => pickRecipe(e.target.value)} className="font-body text-sm w-full px-2.5 py-1.5 rounded-md mb-3" style={{ border: `1px solid ${C.line}` }}>
                    <option value="">Choisir une recette…</option>
                    {recipes.map((r) => <option key={r.id} value={r.id}>{r.nom}</option>)}
                  </select>
                ) : (
                  <TextInput value={form.nom} onChange={(v) => setForm({ ...form, nom: v })} placeholder="Nom de l'aliment" className="mb-3" />
                )}
                <div className="grid grid-cols-4 gap-2 mb-3">
                  {[["kcal", "Kcal"], ["glucides", "Gluc."], ["lipides", "Lip."], ["proteines", "Prot."]].map(([k, l]) => (
                    <TextInput key={k} type="number" value={form[k]} onChange={(v) => setForm({ ...form, [k]: v })} placeholder={l} />
                  ))}
                </div>
                <div className="flex gap-2">
                  <PrimaryBtn color={C.nutrition} onClick={addMeal}><Check size={14} /> Ajouter</PrimaryBtn>
                  <PrimaryBtn color={C.inkFaint} onClick={() => setForm(null)}><X size={14} /> Annuler</PrimaryBtn>
                </div>
              </Card>
            )}
            {items.length > 0 && (
              <Card>
                {items.map((m, idx) => (
                  <div key={m.id} className="flex items-center gap-3 px-4 py-2.5" style={{ borderTop: idx > 0 ? `1px solid ${C.lineSoft}` : "none" }}>
                    <span className="font-body text-sm flex-1" style={{ color: C.ink }}>{m.nom}</span>
                    <span className="font-mono text-xs" style={{ color: C.inkFaint }}>{m.kcal} kcal · G{m.glucides} L{m.lipides} P{m.proteines}</span>
                    <IconBtn danger onClick={() => removeMeal(m.id)}><Trash2 size={13} /></IconBtn>
                  </div>
                ))}
              </Card>
            )}
          </div>
        );
      })}
    </div>
  );
}

            <div><label className="font-mono text-xs" style={{ color: C.inkFaint }}>Masse musculaire (%)</label><TextInput type="number" value={form.muscle} onChange={(v) => setForm({ ...form, muscle: v })} /></div>
            <div><label className="font-mono text-xs" style={{ color: C.inkFaint }}>Eau (%)</label><TextInput type="number" value={form.eau} onChange={(v) => setForm({ ...form, eau: v })} /></div>
            <div><label className="font-mono text-xs" style={{ color: C.inkFaint }}>Masse osseuse (kg)</label><TextInput type="number" value={form.os} onChange={(v) => setForm({ ...form, os: v })} /></div>
          </div>
          <div className="flex gap-2">
            <PrimaryBtn color={C.corps} onClick={save}><Check size={14} /> Enregistrer</PrimaryBtn>
            <PrimaryBtn color={C.inkFaint} onClick={() => setForm(null)}><X size={14} /> Annuler</PrimaryBtn>
          </div>
        </Card>
      )}

      {entries.length === 0 && !form && <EmptyState icon={<Scale size={28} />} color={C.corps} text="Aucune mesure enregistrée pour le moment." />}

      {entries.length > 1 && (
        <Card style={{ padding: 16, marginBottom: 16 }}>
          <div className="font-mono text-xs uppercase tracking-widest mb-3" style={{ color: C.inkFaint }}>Évolution du poids</div>
          <MiniLineChart data={chartData} color={C.corps} />
        </Card>
      )}

      {sorted.length > 0 && (
        <Card>
          {sorted.map((e, idx) => (
            <div key={e.id} className="flex items-center gap-4 px-4 py-2.5 flex-wrap" style={{ borderTop: idx > 0 ? `1px solid ${C.lineSoft}` : "none" }}>
              <span className="font-mono text-xs" style={{ color: C.inkFaint, width: 80 }}>{fmtDateShort(e.date)}</span>
              <span className="font-body text-sm" style={{ color: C.ink }}>{e.poids} kg</span>
              {e.graisse && <span className="font-mono text-xs" style={{ color: C.inkSoft }}>graisse {e.graisse}%</span>}
              {e.muscle && <span className="font-mono text-xs" style={{ color: C.inkSoft }}>muscle {e.muscle}%</span>}
              {e.eau && <span className="font-mono text-xs" style={{ color: C.inkSoft }}>eau {e.eau}%</span>}
              {e.os && <span className="font-mono text-xs" style={{ color: C.inkSoft }}>os {e.os}kg</span>}
              <IconBtn danger onClick={() => remove(e.id)}><Trash2 size={13} /></IconBtn>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

function MuscuTab({ sessions, setSessions, machines, setMachines }) {
  const [view, setView] = useState("seances");
  const [form, setForm] = useState(null);
  const [trackedEx, setTrackedEx] = useState("");
  const [machineForm, setMachineForm] = useState(null);

  const exerciseNames = useMemo(() => {
    const set = new Set();
    sessions.forEach((s) => s.exercices.forEach((ex) => ex.nom && set.add(ex.nom)));
    return [...set];
  }, [sessions]);

  const openForm = () => setForm({ id: uid(), date: todayISO(), nom: "", exercices: [{ id: uid(), nom: "", series: [{ id: uid(), reps: "", poids: "" }] }] });
  const save = () => { if (!form.nom.trim()) return; setSessions([...sessions, form]); setForm(null); };
  const remove = (id) => setSessions(sessions.filter((s) => s.id !== id));
  const updateEx = (exId, patch) => setForm({ ...form, exercices: form.exercices.map((ex) => (ex.id === exId ? { ...ex, ...patch } : ex)) });
  const addEx = () => setForm({ ...form, exercices: [...form.exercices, { id: uid(), nom: "", series: [{ id: uid(), reps: "", poids: "" }] }] });
  const removeEx = (exId) => setForm({ ...form, exercices: form.exercices.filter((ex) => ex.id !== exId) });
  const addSet = (exId) => { const ex = form.exercices.find((e) => e.id === exId); updateEx(exId, { series: [...ex.series, { id: uid(), reps: "", poids: "" }] }); };
  const updateSet = (exId, setId, patch) => { const ex = form.exercices.find((e) => e.id === exId); updateEx(exId, { series: ex.series.map((s) => (s.id === setId ? { ...s, ...patch } : s)) }); };
  const removeSet = (exId, setId) => { const ex = form.exercices.find((e) => e.id === exId); updateEx(exId, { series: ex.series.filter((s) => s.id !== setId) }); };

  const progressionData = useMemo(() => {
    if (!trackedEx) return [];
    return sessions.filter((s) => s.exercices.some((ex) => ex.nom === trackedEx)).sort((a, b) => (a.date < b.date ? -1 : 1))
      .map((s) => { const ex = s.exercices.find((e) => e.nom === trackedEx); const maxPoids = Math.max(...ex.series.map((se) => Number(se.poids) || 0)); return { label: fmtDateShort(s.date), value: maxPoids }; });
  }, [sessions, trackedEx]);

  const sorted = [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1));

  const openMachineForm = () => setMachineForm({ id: uid(), nom: "", poids: "", reglages: "" });
  const saveMachine = () => { if (!machineForm.nom.trim()) return; const exists = machines.some((m) => m.id === machineForm.id); setMachines(exists ? machines.map((m) => (m.id === machineForm.id ? machineForm : m)) : [...machines, machineForm]); setMachineForm(null); };
  const removeMachine = (id) => setMachines(machines.filter((m) => m.id !== id));
  const sortedMachines = [...machines].sort((a, b) => a.nom.localeCompare(b.nom));

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div><Eyebrow color={C.muscu}>Musculation</Eyebrow><h2 className="font-display text-2xl" style={{ color: C.ink }}>{view === "seances" ? "Séances" : "Répertoire machines"}</h2></div>
        {view === "seances" ? <PrimaryBtn color={C.muscu} onClick={openForm}><Plus size={16} /> Nouvelle séance</PrimaryBtn> : <PrimaryBtn color={C.muscu} onClick={openMachineForm}><Plus size={16} /> Nouvelle machine</PrimaryBtn>}
      </div>

      <div className="flex gap-1 mb-5">
        <button onClick={() => setView("seances")} className="font-body text-xs px-3 py-1.5 rounded-full" style={{ background: view === "seances" ? C.muscu : C.lineSoft, color: view === "seances" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Séances</button>
        <button onClick={() => setView("repertoire")} className="font-body text-xs px-3 py-1.5 rounded-full" style={{ background: view === "repertoire" ? C.muscu : C.lineSoft, color: view === "repertoire" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Répertoire machines</button>
      </div>

      {view === "repertoire" ? (
        <div>
          {machineForm && (
            <Card style={{ padding: 16, marginBottom: 16 }}>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <div><label className="font-mono text-xs" style={{ color: C.inkFaint }}>Machine / exercice</label><TextInput value={machineForm.nom} onChange={(v) => setMachineForm({ ...machineForm, nom: v })} placeholder="Ex: Presse à cuisses" /></div>
                <div><label className="font-mono text-xs" style={{ color: C.inkFaint }}>Poids habituel (kg)</label><TextInput type="number" value={machineForm.poids} onChange={(v) => setMachineForm({ ...machineForm, poids: v })} /></div>
              </div>
              <label className="font-mono text-xs" style={{ color: C.inkFaint }}>Réglages (position du siège, amplitude...)</label>
              <textarea value={machineForm.reglages} onChange={(e) => setMachineForm({ ...machineForm, reglages: e.target.value })} rows={2}
                className="font-body text-sm w-full px-2.5 py-2 rounded-md outline-none mb-3 mt-1" style={{ border: `1px solid ${C.line}`, background: "#FCFCFA" }} placeholder="Ex: siège position 4, dossier incliné 2" />
              <div className="flex gap-2">
                <PrimaryBtn color={C.muscu} onClick={saveMachine}><Check size={14} /> Enregistrer</PrimaryBtn>
                <PrimaryBtn color={C.inkFaint} onClick={() => setMachineForm(null)}><X size={14} /> Annuler</PrimaryBtn>
              </div>
            </Card>
          )}
          {machines.length === 0 && !machineForm && <EmptyState icon={<Dumbbell size={28} />} color={C.muscu} text="Aucune machine enregistrée. Ajoutez vos réglages habituels." />}
          <div className="grid grid-cols-2 gap-3">
            {sortedMachines.map((m) => (
              <Card key={m.id} style={{ padding: 14 }}>
                <div className="flex justify-between items-start">
                  <div className="font-display text-base" style={{ color: C.ink }}>{m.nom}</div>
                  <div className="flex gap-1">
                    <IconBtn onClick={() => setMachineForm(m)}><span className="font-mono text-xs px-1">éd.</span></IconBtn>
                    <IconBtn danger onClick={() => removeMachine(m.id)}><Trash2 size={14} /></IconBtn>
                  </div>
                </div>
                {m.poids && <span className="font-mono text-xs px-2 py-1 rounded inline-block mt-2" style={{ background: C.muscuSoft, color: C.muscu }}>{m.poids} kg</span>}
                {m.reglages && <p className="font-body text-xs mt-2" style={{ color: C.inkSoft }}>{m.reglages}</p>}
              </Card>
            ))}
          </div>
        </div>
      ) : (
        <React.Fragment>
          {form && (
            <Card style={{ padding: 20, marginBottom: 16 }}>
              <div className="grid grid-cols-2 gap-3 mb-4">
                <TextInput type="date" value={form.date} onChange={(v) => setForm({ ...form, date: v })} />
                <TextInput value={form.nom} onChange={(v) => setForm({ ...form, nom: v })} placeholder="Nom de la séance (ex: Push day)" />
              </div>
              {form.exercices.map((ex) => (
                <div key={ex.id} className="mb-4" style={{ paddingBottom: 16, borderBottom: `1px solid ${C.lineSoft}` }}>
                  <div className="flex gap-2 mb-2">
                    <TextInput value={ex.nom} onChange={(v) => updateEx(ex.id, { nom: v })} placeholder="Exercice (ex: Développé couché)" />
                    <IconBtn danger onClick={() => removeEx(ex.id)}><Trash2 size={15} /></IconBtn>
                  </div>
                  {machines.length > 0 && (
                    <select value="" onChange={(e) => { const m = machines.find((mm) => mm.id === e.target.value); if (!m) return; updateEx(ex.id, { nom: ex.nom || m.nom, series: ex.series.map((s, i) => (i === 0 && !s.poids ? { ...s, poids: m.poids } : s)) }); }}
                      className="font-mono text-xs px-2 py-1 rounded-md mb-2" style={{ border: `1px solid ${C.line}`, color: C.inkSoft, background: "#FCFCFA" }}>
                      <option value="">↳ insérer un poids du répertoire…</option>
                      {machines.map((m) => <option key={m.id} value={m.id}>{m.nom} — {m.poids ? `${m.poids}kg` : "?"}</option>)}
                    </select>
                  )}
                  <div className="pl-3">
                    <div className="grid gap-2 mb-1" style={{ gridTemplateColumns: "60px 1fr 1fr 32px" }}>
                      <span className="font-mono text-xs" style={{ color: C.inkFaint }}>Série</span><span className="font-mono text-xs" style={{ color: C.inkFaint }}>Reps</span><span className="font-mono text-xs" style={{ color: C.inkFaint }}>Poids (kg)</span><span></span>
                    </div>
                    {ex.series.map((s, si) => (
                      <div key={s.id} className="grid gap-2 mb-1.5 items-center" style={{ gridTemplateColumns: "60px 1fr 1fr 32px" }}>
                        <span className="font-mono text-xs" style={{ color: C.inkFaint }}>#{si + 1}</span>
                        <TextInput type="number" value={s.reps} onChange={(v) => updateSet(ex.id, s.id, { reps: v })} />
                        <TextInput type="number" value={s.poids} onChange={(v) => updateSet(ex.id, s.id, { poids: v })} />
                        <IconBtn danger onClick={() => removeSet(ex.id, s.id)}><X size={14} /></IconBtn>
                      </div>
                    ))}
                    <button onClick={() => addSet(ex.id)} className="font-body text-xs mt-1" style={{ color: C.muscu, background: "none", border: "none", cursor: "pointer" }}>+ série</button>
                  </div>
                </div>
              ))}
              <button onClick={addEx} className="font-body text-xs mb-4" style={{ color: C.muscu, background: "none", border: "none", cursor: "pointer" }}>+ ajouter un exercice</button>
              <div className="flex gap-2">
                <PrimaryBtn color={C.muscu} onClick={save}><Check size={14} /> Enregistrer la séance</PrimaryBtn>
                <PrimaryBtn color={C.inkFaint} onClick={() => setForm(null)}><X size={14} /> Annuler</PrimaryBtn>
              </div>
            </Card>
          )}

          {sessions.length === 0 && !form && <EmptyState icon={<Dumbbell size={28} />} color={C.muscu} text="Aucune séance enregistrée. Ajoutez la première." />}

          {exerciseNames.length > 0 && (
            <Card style={{ padding: 16, marginBottom: 16 }}>
              <div className="flex items-center justify-between mb-3">
                <span className="font-mono text-xs uppercase tracking-widest" style={{ color: C.inkFaint }}>Progression</span>
                <select value={trackedEx} onChange={(e) => setTrackedEx(e.target.value)} className="font-body text-sm px-2 py-1 rounded-md" style={{ border: `1px solid ${C.line}` }}>
                  <option value="">Choisir un exercice…</option>
                  {exerciseNames.map((n) => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              {trackedEx && progressionData.length > 0 && <MiniLineChart data={progressionData} color={C.muscu} />}
            </Card>
          )}

          {sorted.map((s) => (
            <Card key={s.id} style={{ padding: 16, marginBottom: 10 }}>
              <div className="flex justify-between items-start mb-2">
                <div><div className="font-display text-lg" style={{ color: C.ink }}>{s.nom}</div><div className="font-mono text-xs" style={{ color: C.inkFaint }}>{fmtDateShort(s.date)}</div></div>
                <IconBtn danger onClick={() => remove(s.id)}><Trash2 size={14} /></IconBtn>
              </div>
              {s.exercices.map((ex) => (
                <div key={ex.id} className="flex items-center gap-3 py-1 flex-wrap">
                  <span className="font-body text-sm" style={{ color: C.ink, minWidth: 140 }}>{ex.nom}</span>
                  <span className="font-mono text-xs" style={{ color: C.inkFaint }}>{ex.series.map((se) => `${se.reps}×${se.poids}kg`).join("  ·  ")}</span>
                </div>
              ))}
            </Card>
          ))}
        </React.Fragment>
      )}
    </div>
  );
}

function PlanningTab({ items, setItems, recipes }) {
  const [weekStart, setWeekStart] = useState(startOfWeek(todayISO()));
  const [view, setView] = useState("jours");
  const [form, setForm] = useState(null);

  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const openForm = (date, repasType) => setForm({ dates: new Set(date ? [date] : []), type: "repas", label: "", recipeId: "", repasType: repasType || REPAS_TYPES[1] });
  const toggleDay = (date) => { const next = new Set(form.dates); next.has(date) ? next.delete(date) : next.add(date); setForm({ ...form, dates: next }); };
  const save = () => {
    const label = form.type === "repas" && form.recipeId ? recipes.find((r) => r.id === form.recipeId)?.nom || form.label : form.label;
    if (!label.trim() || form.dates.size === 0) return;
    const newItems = [...form.dates].map((date) => ({ id: uid(), date, type: form.type, repasType: form.type === "repas" ? form.repasType : undefined, label, done: false }));
    setItems([...items, ...newItems]); setForm(null);
  };
  const toggleDone = (id) => setItems(items.map((it) => (it.id === id ? { ...it, done: !it.done } : it)));
  const remove = (id) => setItems(items.filter((it) => it.id !== id));

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div><Eyebrow color={C.planning}>Planning</Eyebrow><h2 className="font-display text-2xl" style={{ color: C.ink }}>Semaine</h2></div>
        <div className="flex items-center gap-2">
          <IconBtn onClick={() => setWeekStart(addDays(weekStart, -7))}><ChevronLeft size={16} /></IconBtn>
          <span className="font-mono text-sm" style={{ color: C.ink }}>{fmtDateShort(weekStart)} — {fmtDateShort(addDays(weekStart, 6))}</span>
          <IconBtn onClick={() => setWeekStart(addDays(weekStart, 7))}><ChevronRight size={16} /></IconBtn>
          <PrimaryBtn color={C.planning} onClick={() => openForm(null)}><Plus size={15} /> Planifier plusieurs jours</PrimaryBtn>
        </div>
      </div>

      <div className="flex gap-1 mb-5">
        <button onClick={() => setView("jours")} className="font-body text-xs px-3 py-1.5 rounded-full" style={{ background: view === "jours" ? C.planning : C.lineSoft, color: view === "jours" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Planning libre</button>
        <button onClick={() => setView("menu")} className="font-body text-xs px-3 py-1.5 rounded-full" style={{ background: view === "menu" ? C.planning : C.lineSoft, color: view === "menu" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Menu des repas</button>
      </div>

      {view === "menu" ? (
        <div className="overflow-x-auto">
          <div className="grid gap-2" style={{ gridTemplateColumns: "110px repeat(7, minmax(120px, 1fr))", minWidth: 780 }}>
            <div></div>
            {days.map((date, i) => {
              const isToday = date === todayISO();
              return <div key={date} className="font-mono text-xs text-center py-1.5 rounded" style={{ background: isToday ? C.planningSoft : "transparent", color: isToday ? C.planning : C.inkSoft }}>{JOURS[i]} {fmtDateShort(date).split(" ")[0]}</div>;
            })}
            {REPAS_TYPES.map((rt) => (
              <React.Fragment key={rt}>
                <div className="font-body text-xs flex items-center" style={{ color: C.inkSoft }}>{rt}</div>
                {days.map((date) => {
                  const cellItems = items.filter((it) => it.type === "repas" && it.date === date && it.repasType === rt);
                  return (
                    <div key={date + rt} className="rounded-lg p-1.5 flex flex-col gap-1" style={{ border: `1px solid ${C.line}`, minHeight: 56 }}>
                      {cellItems.map((it) => (
                        <div key={it.id} onClick={() => toggleDone(it.id)} className="rounded px-1.5 py-1 cursor-pointer flex items-start justify-between gap-1" style={{ background: C.nutritionSoft, opacity: it.done ? 0.5 : 1 }}>
                          <span className="font-body text-xs" style={{ color: C.nutrition, textDecoration: it.done ? "line-through" : "none" }}>{it.label}</span>
                          <button onClick={(e) => { e.stopPropagation(); remove(it.id); }} style={{ color: C.inkFaint, background: "none", border: "none", cursor: "pointer" }}><X size={11} /></button>
                        </div>
                      ))}
                      <button onClick={() => openForm(date, rt)} className="font-body text-xs" style={{ color: C.inkFaint, background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>+ ajouter</button>
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
        </div>
      ) : (
        <div className="grid grid-cols-7 gap-2">
          {days.map((date, i) => {
            const dayItems = items.filter((it) => it.date === date);
            const isToday = date === todayISO();
            return (
              <div key={date} className="rounded-lg overflow-hidden flex flex-col" style={{ border: `1px solid ${isToday ? C.planning : C.line}`, minHeight: 200 }}>
                <div className="px-2 py-1.5 flex justify-between items-center" style={{ background: isToday ? C.planningSoft : C.lineSoft }}>
                  <span className="font-mono text-xs" style={{ color: isToday ? C.planning : C.inkSoft }}>{JOURS[i]} {fmtDateShort(date).split(" ")[0]}</span>
                  <button onClick={() => openForm(date)} style={{ color: isToday ? C.planning : C.inkFaint, background: "none", border: "none", cursor: "pointer" }}><Plus size={13} /></button>
                </div>
                <div className="p-1.5 flex-1 flex flex-col gap-1">
                  {dayItems.map((it) => (
                    <div key={it.id} onClick={() => toggleDone(it.id)} className="rounded px-1.5 py-1 cursor-pointer flex items-start justify-between gap-1" style={{ background: it.type === "repas" ? C.nutritionSoft : C.muscuSoft, opacity: it.done ? 0.5 : 1 }}>
                      <span className="font-body text-xs" style={{ color: it.type === "repas" ? C.nutrition : C.muscu, textDecoration: it.done ? "line-through" : "none" }}>{it.label}</span>
                      <button onClick={(e) => { e.stopPropagation(); remove(it.id); }} style={{ color: C.inkFaint, background: "none", border: "none", cursor: "pointer" }}><X size={11} /></button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {form && (
        <Card style={{ padding: 16, marginTop: 16 }}>
          <div className="font-mono text-xs uppercase tracking-widest mb-2" style={{ color: C.inkFaint }}>Jours concernés</div>
          <div className="flex gap-1.5 mb-4 flex-wrap">
            {days.map((date, i) => {
              const on = form.dates.has(date);
              return <button key={date} onClick={() => toggleDay(date)} className="font-mono text-xs px-2.5 py-1.5 rounded-md" style={{ background: on ? C.planning : C.lineSoft, color: on ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>{JOURS[i]}</button>;
            })}
          </div>
          <div className="flex gap-2 mb-3">
            <button onClick={() => setForm({ ...form, type: "repas" })} className="font-body text-xs px-2.5 py-1 rounded-full" style={{ background: form.type === "repas" ? C.nutrition : C.lineSoft, color: form.type === "repas" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Repas</button>
            <button onClick={() => setForm({ ...form, type: "muscu" })} className="font-body text-xs px-2.5 py-1 rounded-full" style={{ background: form.type === "muscu" ? C.muscu : C.lineSoft, color: form.type === "muscu" ? "#fff" : C.inkSoft, border: "none", cursor: "pointer" }}>Musculation</button>
          </div>
          {form.type === "repas" && (
            <select value={form.repasType} onChange={(e) => setForm({ ...form, repasType: e.target.value })} className="font-body text-sm w-full px-2.5 py-1.5 rounded-md mb-3" style={{ border: `1px solid ${C.line}` }}>
              {REPAS_TYPES.map((rt) => <option key={rt} value={rt}>{rt}</option>)}
            </select>
          )}
          {form.type === "repas" && recipes.length > 0 && (
            <select value={form.recipeId} onChange={(e) => setForm({ ...form, recipeId: e.target.value })} className="font-body text-sm w-full px-2.5 py-1.5 rounded-md mb-3" style={{ border: `1px solid ${C.line}` }}>
              <option value="">— ou saisir un libellé libre —</option>
              {recipes.map((r) => <option key={r.id} value={r.id}>{r.nom}</option>)}
            </select>
          )}
          <TextInput value={form.label} onChange={(v) => setForm({ ...form, label: v })} placeholder="Libellé (ex: Jambes, Salade de pois chiches...)" className="mb-3" />
          <div className="flex gap-2">
            <PrimaryBtn color={C.planning} onClick={save}><Check size={14} /> Ajouter</PrimaryBtn>
            <PrimaryBtn color={C.inkFaint} onClick={() => setForm(null)}><X size={14} /> Annuler</PrimaryBtn>
          </div>
        </Card>
      )}
    </div>
  );
}

const TABS = [
  { id: "recettes", label: "Recettes", icon: BookOpen, color: C.nutrition },
  { id: "courses", label: "Courses", icon: ShoppingCart, color: C.courses },
  { id: "repas", label: "Repas", icon: Flame, color: C.nutrition },
  { id: "corps", label: "Corps", icon: Scale, color: C.corps },
  { id: "muscu", label: "Muscu", icon: Dumbbell, color: C.muscu },
  { id: "planning", label: "Planning", icon: CalendarDays, color: C.planning },
];

function App() {
  const [tab, setTab] = useState("recettes");
  const [profileId, setProfileId] = useState("p1");
  const { data, update, ready, synced } = useSyncedStore();

  const addToGrocery = (ingredients) => {
    const next = [...data.grocery];
    ingredients.forEach((ing) => {
      const existing = next.find((x) => x.nom.toLowerCase() === ing.nom.toLowerCase() && !x.checked);
      if (existing) existing.qte = existing.qte && ing.qte ? `${existing.qte} + ${ing.qte}` : (existing.qte || ing.qte);
      else next.push({ id: uid(), nom: ing.nom, qte: ing.qte, unite: ing.unite, checked: false });
    });
    update({ grocery: next });
    setTab("courses");
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `carnet-export-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (!ready) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg }}><span className="font-mono text-sm" style={{ color: C.inkFaint }}>chargement du carnet…</span></div>;
  }

  const TabComponent = {
    recettes: <RecettesTab recipes={data.recipes} setRecipes={(v) => update({ recipes: v })} addToGrocery={addToGrocery} />,
    courses: <CoursesTab grocery={data.grocery} setGrocery={(v) => update({ grocery: v })} />,
    repas: <RepasTab recipes={data.recipes} meals={data.meals[profileId]} setMeals={(v) => update({ meals: { ...data.meals, [profileId]: v } })}
      targets={data.targets[profileId]} setTargets={(v) => update({ targets: { ...data.targets, [profileId]: v } })} />,
    corps: <CorpsTab entries={data.body[profileId]} setEntries={(v) => update({ body: { ...data.body, [profileId]: v } })} />,
    muscu: <MuscuTab sessions={data.workouts[profileId]} setSessions={(v) => update({ workouts: { ...data.workouts, [profileId]: v } })}
      machines={data.machines[profileId]} setMachines={(v) => update({ machines: { ...data.machines, [profileId]: v } })} />,
    planning: <PlanningTab items={data.planning[profileId]} setItems={(v) => update({ planning: { ...data.planning, [profileId]: v } })} recipes={data.recipes} />,
  }[tab];

  const needsProfile = ["repas", "corps", "muscu", "planning"].includes(tab);

  return (
    <div className="font-body" style={{ minHeight: "100vh", background: C.bg }}>
      <div className="max-w-4xl mx-auto px-5 pt-8 pb-24">
        <header className="flex items-end justify-between mb-6 flex-wrap gap-3">
          <div>
            <div className="flex items-center gap-2">
              <h1 className="font-display text-3xl" style={{ color: C.ink }}>Carnet</h1>
              <span title={synced ? "synchronisé" : "synchronisation…"} style={{ width: 7, height: 7, borderRadius: 999, background: synced ? C.nutrition : "#C9A227", display: "inline-block" }} />
              <IconBtn onClick={exportData} title="Exporter toutes les données (JSON)"><Download size={15} /></IconBtn>
            </div>
            <p className="font-mono text-xs mt-1" style={{ color: C.inkFaint, letterSpacing: "0.08em" }}>ALIMENTATION · CORPS · MUSCULATION · PLANNING</p>
          </div>
          {needsProfile && (
            <div className="flex rounded-full p-1" style={{ background: C.lineSoft }}>
              {["p1", "p2"].map((pid) => (
                <button key={pid} onClick={() => setProfileId(pid)} className="font-body text-sm px-3 py-1 rounded-full transition-colors"
                  style={{ background: profileId === pid ? C.paper : "transparent", color: profileId === pid ? C.ink : C.inkFaint, boxShadow: profileId === pid ? "0 1px 2px rgba(0,0,0,0.06)" : "none", border: "none", cursor: "pointer" }}>
                  <input value={data.profiles[pid].name} onChange={(e) => update({ profiles: { ...data.profiles, [pid]: { name: e.target.value } } })} onClick={(e) => e.stopPropagation()}
                    className="bg-transparent outline-none text-center" style={{ color: "inherit", font: "inherit", border: "none", width: 96 }} />
                </button>
              ))}
            </div>
          )}
        </header>

        <nav className="flex gap-1 mb-6 flex-wrap" style={{ borderBottom: `1px solid ${C.line}` }}>
          {TABS.map((t) => {
            const Icon2 = t.icon; const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} className="font-body text-sm px-3.5 py-2.5 inline-flex items-center gap-1.5 relative -mb-px"
                style={{ color: active ? t.color : C.inkFaint, background: "none", border: "none", cursor: "pointer" }}>
                <Icon2 size={15} />{t.label}
                {active && <span className="absolute" style={{ left: 0, right: 0, bottom: 0, height: 2.5, borderRadius: 999, background: t.color }} />}
              </button>
            );
          })}
        </nav>

        {TabComponent}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
